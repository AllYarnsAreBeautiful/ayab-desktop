# Lint, test and type check the Python code.
# The steps are defined as mise tasks in mise.toml: run `mise run ci` locally
# to reproduce this workflow.

name: Python Tests

on: [push, pull_request]

jobs:
  run-pytest:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y libasound2-dev qt6-base-dev qt6-tools-dev-tools
      - name: Install Python and uv with mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - name: Lint, test and type check
        run: mise run ci
